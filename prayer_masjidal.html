<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Prayer Times</title>
    <style>
        body {
            background-color: #1a1a1a; /* Dark gray */
            color: #f0f0f0; /* Off-white */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #current-time {
            font-size: 4em; /* Large clock font */
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #4CAF50; /* Green accent for clock */
        }

        #current-date {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #bbb; /* Lighter gray for date */
        }

        #prayer-times-table table {
            width: 80%;
            max-width: 700px; /* Max width for very large screens */
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #2c2c2c; /* Slightly lighter background for table */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #prayer-times-table th,
        #prayer-times-table td {
            border: 1px solid #444; /* Cell borders */
            padding: 12px 15px;
            text-align: left;
        }

        #prayer-times-table th {
            background-color: #333; /* Header background */
            color: #4CAF50; /* Green accent for headers */
            font-size: 1.2em;
            text-align: center;
        }

        #prayer-times-table td:nth-child(1) { /* Prayer name column */
            font-weight: bold;
            color: #ddd;
        }

        #prayer-times-table td:nth-child(2), /* Adhan time */
        #prayer-times-table td:nth-child(3) { /* Iqamah time */
            text-align: center;
            font-family: 'Courier New', Courier, monospace; /* Monospace for time figures */
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div id="current-time"></div>
    <div id="current-date"></div>

    <div id="prayer-times-table">
        <table>
            <thead>
                <tr>
                    <th>Prayer</th>
                    <th>Adhan (Begins)</th>
                    <th>Iqamah (Jama'ah)</th>
                </tr>
            </thead>
            <tbody id="prayer-times-body">
                <!-- Rows will be populated by JavaScript -->
                <!-- Example row structure (JS will generate these):
                <tr>
                    <td>Fajr</td>
                    <td id="fajr-adhan">--:-- AM</td>
                    <td id="fajr-iqamah">--:-- AM</td>
                </tr>
                <tr>
                    <td>Sunrise</td>
                    <td id="sunrise-adhan">--:-- AM</td>
                    <td></td>
                </tr>
                <tr>
                    <td>Dhuhr</td>
                    <td id="dhuhr-adhan">--:-- PM</td>
                    <td id="dhuhr-iqamah">--:-- PM</td>
                </tr>
                <tr>
                    <td>Asr</td>
                    <td id="asr-adhan">--:-- PM</td>
                    <td id="asr-iqamah">--:-- PM</td>
                </tr>
                <tr>
                    <td>Maghrib</td>
                    <td id="maghrib-adhan">--:-- PM</td>
                    <td id="maghrib-iqamah">--:-- PM</td>
                </tr>
                <tr>
                    <td>Isha</td>
                    <td id="isha-adhan">--:-- PM</td>
                    <td id="isha-iqamah">--:-- PM</td>
                </tr>
                 <tr>
                    <td colspan="3" id="jummah-times"></td>
                </tr>
                -->
            </tbody>
        </table>
    </div>

    <script src="prayer_masjidal.js" defer></script>
</body>
</html>
